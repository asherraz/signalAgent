name: Agent Rota

on:
  schedule:
    - cron: "0 6 * * 1-5"
    - cron: "0 7 * * 1"
  workflow_dispatch:

jobs:
  run-agent:
    if: github.event_name != 'schedule' || github.event.schedule == '0 6 * * 1-5'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - id: pre
        run: echo "base_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - id: due
        run: python3 scripts/check_due.py >> "$GITHUB_OUTPUT"

      - uses: anthropics/claude-code-action@v1
        if: steps.due.outputs.due == 'true'
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          settings: |
            {
              "env": {
                "CLAUDE_CODE_PROMPT_CACHE_TTL": "1h"
              }
            }
          prompt: |
            You are running today's turn of the agent rota for this repo —
            the development record for SGL-001, an intranasal preparation
            for cognitive function whose active is chosen on evidence, not
            assumed. Agents run on a rota, read their state, produce
            artifacts, and append what they learned. The commit history is
            the development record.

            Today's agent has already been picked for you, outside this
            session, from each agent's cadence and last-run date:
            **${{ steps.due.outputs.agent }}**. Do not re-derive or
            second-guess this choice — just run that agent.

            1. Read agents/${{ steps.due.outputs.agent }}.md in full and
               follow it exactly — what it reads, what it produces, and its
               rules. Read state/${{ steps.due.outputs.agent }}.md to see
               what it already knows. If that state file doesn't exist yet
               or is empty, follow the brief's "First run" section if it
               has one.
            2. Do the work. Use primary sources the way the brief requires
               (statute text, regulator guidance, registries — not
               secondary summaries) via WebSearch/WebFetch. Write or update
               the artifact(s) the brief makes this agent responsible for
               in artifacts/, append findings to state/${{ steps.due.outputs.agent }}.md,
               and drop any post drafts worth publishing into posts/ (one
               file per day, under 280 characters, primary source cited).
               Follow every rule in the brief, including ones about tone,
               scope, and never softening unfavorable findings.
            3. If you added or changed anything in artifacts/, regenerate
               artifacts/index.json by running
               `python3 scripts/generate_artifacts_index.py` before
               committing — this is required by the rule in CLAUDE.md.
            4. If you made any change worth keeping, configure git identity
               if needed (`git config user.name` / `user.email`), stage it,
               and commit with a message describing what was found or
               produced, in the style of prior commits (e.g.
               "jurisdiction: texas"). Push the commit.
            5. If nothing material changed — no new findings, no artifact
               update, nothing worth a state append — commit nothing.
               Do not create an empty or filler commit just to show
               activity.
          claude_args: |
            --allowedTools "Bash,Read,Write,Edit,Glob,Grep,WebFetch,WebSearch"
            --max-turns 30

      - id: check-artifacts
        if: steps.due.outputs.due == 'true'
        run: |
          NEW_SHA=$(git rev-parse HEAD)
          BASE_SHA="${{ steps.pre.outputs.base_sha }}"
          if [ "$NEW_SHA" = "$BASE_SHA" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          elif git diff --name-only "$BASE_SHA" "$NEW_SHA" -- artifacts/ | grep -q .; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: anthropics/claude-code-action@v1
        if: steps.due.outputs.due == 'true' && steps.check-artifacts.outputs.changed == 'true'
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          settings: |
            {
              "env": {
                "CLAUDE_CODE_PROMPT_CACHE_TTL": "1h"
              }
            }
          prompt: |
            You are running the challenge agent for this repo — the
            development record for SGL-001, an intranasal preparation for
            cognitive function whose active is chosen on evidence. The rota
            agent that just ran (${{ steps.due.outputs.agent }}) changed a
            file in artifacts/, which is this agent's trigger to run.

            1. Read agents/challenge.md in full and follow it exactly —
               what it reads, what it produces, and its rules. It must not
               defer to the producing agent's own conclusions.
            2. Identify which artifact(s) ${{ steps.due.outputs.agent }}
               changed this run (from the diff of this job's checkout
               against the commit before it ran, or from the newest entry
               in artifacts/runs.json), and read agents/${{ steps.due.outputs.agent }}.md
               to know what it was supposed to do.
            3. Attack the artifact per the brief: trace claims to their
               cited primary sources (refetch them, don't take the
               artifact's word), check whether anything recorded as
               missing or open was actually searched exhaustively, and
               check whether any named lead or verdict is earned by the
               evidence presented or inherited from assumption.
            4. Write the entry into artifacts/challenges.md, newest first,
               per the brief's format. Do not edit the target artifact
               itself — a challenge is a finding, not a correction.
            5. Regenerate artifacts/index.json by running
               `python3 scripts/generate_artifacts_index.py`.
            6. Configure git identity if needed, stage challenges.md and
               index.json, and commit with a message describing what the
               challenge found (e.g. "challenge: formulation's EV lead
               traces to inherited assumption, not evidence"). Push the
               commit in the same push as this job's other commits — do
               not force-push or rewrite an earlier commit.
          claude_args: |
            --allowedTools "Bash,Read,Write,Edit,Glob,Grep,WebFetch,WebSearch"
            --max-turns 30

  run-synthesize:
    if: github.event_name != 'schedule' || github.event.schedule == '0 7 * * 1'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - id: synth-due
        run: python3 scripts/check_synthesis_due.py >> "$GITHUB_OUTPUT"

      - uses: anthropics/claude-code-action@v1
        if: steps.synth-due.outputs.due == 'true'
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          settings: |
            {
              "env": {
                "CLAUDE_CODE_PROMPT_CACHE_TTL": "1h"
              }
            }
          prompt: |
            You are running the weekly synthesize agent for this repo —
            the development record for SGL-001, an intranasal preparation
            for cognitive function whose active is chosen on evidence.
            This job runs once a week, separately from the daily agent
            rota, and only because scripts/check_synthesis_due.py found a
            change under artifacts/ since synthesis.md was last committed.

            1. Read agents/synthesize.md in full and follow it exactly —
               what it reads, what it produces, and its rules, including
               the confidentiality boundary around
               artifacts/japan-asset-longlist.md and artifacts/dossiers/.
            2. Read every file directly in artifacts/ (not artifacts/data/,
               not artifacts/dossiers/ beyond what the brief's
               confidentiality rule allows), plus artifacts/runs.json in
               full, plus the existing artifacts/synthesis.md if present.
            3. Write artifacts/synthesis.md and a dated copy at
               artifacts/synthesis/YYYY-MM-DD.md (today's date), per the
               brief's structure, word cap, and linking rule.
            4. Regenerate artifacts/index.json by running
               `python3 scripts/generate_artifacts_index.py`.
            5. Configure git identity if needed, stage synthesis.md, the
               dated copy, and index.json, and commit with a message
               describing what changed in the synthesis (e.g.
               "synthesize: <n>-day update, new conflict noted"). Push the
               commit.
            6. If, after reading everything, nothing in synthesis.md would
               actually change from the last version, commit nothing.
          claude_args: |
            --allowedTools "Bash,Read,Write,Edit,Glob,Grep"
            --max-turns 30
